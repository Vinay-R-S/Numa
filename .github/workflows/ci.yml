name: CI

# `develop` included. Every phase of the restructure has been merged into
# develop through PRs, and none of it ever reached main, so CI - including the
# gitleaks job added specifically to stop the next credential leak - had not run
# on any of this work (NUMA-143 P7).
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitleaks walks history, so a shallow clone would scan one commit and
          # report clean on a repo that leaked a key three commits ago.
          fetch-depth: 0

      - name: Install gitleaks
        # The release binary, not the Docker image: the image runs as root over
        # a workspace owned by the runner user, and gitleaks shells out to git,
        # which refuses a repository it does not own ("dubious ownership").
        # Pinned, because a scanner that silently changes its rules changes what
        # a green CI run means from one week to the next.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz             | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the commits under review
        # Scoped to this push or PR, not to all history. History already carries
        # Google OAuth credentials committed in 434d716 / fa1a9e7 / af6203c and
        # deleted later, so a full scan would fail every run forever and the job
        # would be turned off within a week. Those keys need rotating; this job
        # exists to stop the next one, and it fails the build when it finds it.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE:-}" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]              && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Scanning $BASE..HEAD"
            ./gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="$BASE..HEAD"
          else
            echo "No usable base commit; scanning the working tree"
            ./gitleaks detect --source . --redact --no-banner --exit-code 1 --no-git
          fi

  unit-tests:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      # The whole server requirement set, not just pytest. These tests import
      # `src/` and `main.py`, which is the point of them: the suite that ran
      # here before imported nothing from the application, so a green run said
      # nothing about the code (NUMA-143 P7).
      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        env:
          # Never a real credential: these tests must not need one, and a job
          # that quietly depends on a secret stops running for forks.
          JWT_SECRET: test-jwt-secret-not-a-real-key
          TIMEZONE: Asia/Kolkata
        # A directory, not a hand-maintained file list. The previous matrix
        # named every file explicitly, so a new test file was collected by
        # nobody and protected nothing until someone remembered to add it.
        run: python -m pytest tests/unit -q

  legacy-tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Suite 1 - Core Logic
            paths: tests/legacy/test_unit.py tests/legacy/test_data_validation.py
          - suite: Suite 2 - User Workflows
            paths: tests/legacy/test_functional.py tests/legacy/test_uat.py tests/legacy/test_complex_workflows.py
          - suite: Suite 3 - Integration and API Contracts
            paths: tests/legacy/test_integration.py tests/legacy/test_api_contract.py
          - suite: Suite 4 - Security Controls
            paths: tests/legacy/test_security.py
          - suite: Suite 5 - Smoke Sanity Regression
            paths: tests/legacy/test_smoke.py tests/legacy/test_sanity.py tests/legacy/test_regression.py
          - suite: Suite 6 - Performance and Edge Cases
            paths: tests/legacy/test_performance.py tests/legacy/test_edge_cases.py
          - suite: Suite 7 - System and Error Handling
            paths: tests/legacy/test_system.py tests/legacy/test_error_handling.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # These import nothing from the application, so bare pytest is enough and
      # the job stays fast. See tests/README.md for why they are kept.
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run ${{ matrix.suite }}
        run: python -m pytest ${{ matrix.paths }}

  secret-config-checks:
    name: Suite 8 - Secret Config Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run secret config checks
        env:
          RUN_SECRET_INTEGRATION_TESTS: ${{ secrets.RUN_SECRET_INTEGRATION_TESTS }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GOOGLE_FIT_CLIENT_ID: ${{ secrets.GOOGLE_FIT_CLIENT_ID }}
          GOOGLE_FIT_CLIENT_SECRET: ${{ secrets.GOOGLE_FIT_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          GOOGLE_OAUTH_SUCCESS_REDIRECT: ${{ secrets.GOOGLE_OAUTH_SUCCESS_REDIRECT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL_ENDPOINT: ${{ secrets.QDRANT_URL_ENDPOINT }}
          SLACK_BOT_SCOPES: ${{ secrets.SLACK_BOT_SCOPES }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_MESSAGE_RETENTION_DAYS: ${{ secrets.SLACK_MESSAGE_RETENTION_DAYS }}
          SLACK_OAUTH_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
          SLACK_REDIRECT_URI: ${{ secrets.SLACK_REDIRECT_URI }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_USER_OAUTH_TOKEN: ${{ secrets.SLACK_USER_OAUTH_TOKEN }}
          STRAVA_ACCESS_TOKEN: ${{ secrets.STRAVA_ACCESS_TOKEN }}
          STRAVA_AUTH_CODE: ${{ secrets.STRAVA_AUTH_CODE }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python -m pytest tests/secret_checks -q
