name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-suites:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Suite 1 - Core Logic
            paths: tests/test_unit.py tests/test_data_validation.py
          - suite: Suite 2 - User Workflows
            paths: tests/test_functional.py tests/test_uat.py tests/test_complex_workflows.py
          - suite: Suite 3 - Integration and API Contracts
            paths: tests/test_integration.py tests/test_api_contract.py
          - suite: Suite 4 - Security Controls
            paths: tests/test_security.py
          - suite: Suite 5 - Smoke Sanity Regression
            paths: tests/test_smoke.py tests/test_sanity.py tests/test_regression.py
          - suite: Suite 6 - Performance and Edge Cases
            paths: tests/test_performance.py tests/test_edge_cases.py
          - suite: Suite 7 - System and Error Handling
            paths: tests/test_system.py tests/test_error_handling.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run ${{ matrix.suite }}
        run: python -m pytest ${{ matrix.paths }}
